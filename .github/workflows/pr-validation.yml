name: PR Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (PR)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check version increment
        run: |
          PR_VERSION=$(node -p "require('./package.json').version")
          MAIN_VERSION=$(node -p "require('./main-branch/package.json').version")
          
          echo "PR version: $PR_VERSION"
          echo "Main version: $MAIN_VERSION"
          
          # Use node semver to compare (gt = greater than)
          if ! node -e "
            const semver = require('semver');
            const pr = '$PR_VERSION';
            const main = '$MAIN_VERSION';
            if (!semver.gt(pr, main)) {
              console.error('ERROR: PR version (' + pr + ') must be strictly greater than main version (' + main + ')');
              process.exit(1);
            }
            console.log('Version check passed: ' + pr + ' > ' + main);
          "; then
            exit 1
          fi

      - name: Verify package.json validity
        run: npm pkg fix --dry-run