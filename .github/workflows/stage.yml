name: Auto Stage to npm

on:
  push:
    branches: [refactor]  # Change to [main] for production

permissions:
  id-token: write
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    # NO environment gate — fully automated on GitHub side
    # Manual approval only on npm side (promote from staging)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm stage publish --access public